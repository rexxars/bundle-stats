name: 'Bundle Stats'
description: 'Compare ESM bundle scenarios and import times with Rolldown.'
branding:
  icon: package
  color: blue

inputs:
  config:
    description: 'Path to an ESM bundle-stats config file.'
    default: 'bundle-stats.config.ts'
  build-script:
    description: 'npm script name to run for each configured package.'
    default: 'build'
  build-command:
    description: 'Command to run once instead of per-package builds.'
    default: ''
  base-ref:
    description: 'Git ref for the baseline. Defaults to the pull request base SHA.'
    default: ''
  head-ref:
    description: 'Git ref for the current report. Defaults to the current SHA.'
    default: ''
  comment-id:
    description: 'Identifier used to keep independent bundle-stats comments separate.'
    default: 'default'

runs:
  using: 'composite'
  steps:
    - name: Run bundle stats comparison
      id: stats
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BUILD_SCRIPT: ${{ inputs.build-script }}
        INPUT_BUILD_COMMAND: ${{ inputs.build-command }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_COMMENT_ID: ${{ inputs.comment-id }}
        GITHUB_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      run: |
        exit_code=0
        bash "${{ github.action_path }}/action/run.sh" || exit_code=$?
        echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"

    - name: Upload treemap artifacts
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: bundle-treemaps
        path: ${{ github.workspace }}/.bundle-stats/
        include-hidden-files: true
        if-no-files-found: ignore

    - name: Propagate result
      if: '!cancelled()'
      shell: bash
      run: exit ${{ steps.stats.outputs.exit-code }}
